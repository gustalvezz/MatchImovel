        <!-- Google Consent Mode v2: default state (denied) — must run before GTM loads.
             Reads any prior choice from localStorage (new {analytics,marketing} JSON format,
             with a fallback for the old 'all'/'essential' string format). -->
        <script>
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('consent', 'default', {
            ad_storage: 'denied',
            analytics_storage: 'denied',
            ad_user_data: 'denied',
            ad_personalization: 'denied',
            functionality_storage: 'denied',
            security_storage: 'granted',
            wait_for_update: 500
          });
          try {
            var raw = localStorage.getItem('cookie_consent');
            var analytics = false, marketing = false;
            if (raw === 'all') { analytics = true; marketing = true; }
            else if (raw === 'essential') { analytics = false; marketing = false; }
            else if (raw) { var parsed = JSON.parse(raw); analytics = !!parsed.analytics; marketing = !!parsed.marketing; }
            if (analytics || marketing) {
              gtag('consent', 'update', {
                analytics_storage: analytics ? 'granted' : 'denied',
                ad_storage: marketing ? 'granted' : 'denied',
                ad_user_data: marketing ? 'granted' : 'denied',
                ad_personalization: marketing ? 'granted' : 'denied',
                functionality_storage: 'granted'
              });
            }
          } catch (e) {}
        </script>
